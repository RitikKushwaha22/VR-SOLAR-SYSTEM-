<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VR Solar System</title>
<style>
:root{--ink:#e8efff;--blue:#638cff;--bg:#02040c}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden}
canvas{display:block;touch-action:none}
#top{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
#top h1{margin:0;font-size:18px}#top p{margin:2px 0 0;font-size:12px;color:#9eafd0}
#vr{pointer-events:auto;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;padding:10px 14px;height:fit-content}
#vr:disabled{background:#26385f;color:#9eafd0}
#panel{position:fixed;left:12px;bottom:max(12px,env(safe-area-inset-bottom));width:min(440px,92vw);display:none;border-radius:14px}
</style></head><body>
<div id="top"><div><h1>✦ VR Solar System</h1><p>Drag = rotate · wheel/pinch = zoom · tap a planet or moon for info</p></div><button id="vr" disabled>Checking VR…</button></div>
<canvas id="panel" width="1024" height="640"></canvas>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
const V3=THREE.Vector3,$=id=>document.getElementById(id);
const P=[
{id:'mercury',name:'Mercury',type:'Rocky planet',color:'#b6a99a',size:3.2,period:87.97,diam:4879,mass:.33,g:3.7,day:58.6,temp:167,moons:0,a:.387,summary:'The smallest planet races around the Sun in just under 88 Earth days.',fact:'Extreme temperature swings and the shortest year of all eight planets.'},
{id:'venus',name:'Venus',type:'Rocky planet',color:'#e7b66d',size:5.5,period:224.7,diam:12104,mass:4.87,g:8.87,day:-243,temp:464,moons:0,a:.723,summary:'A cloud-covered world where a runaway greenhouse effect creates extreme heat.',fact:'Venus rotates backwards compared with most planets and is the hottest planet.'},
{id:'earth',name:'Earth',type:'Rocky planet',color:'#3889f5',size:6.1,period:365.256,diam:12742,mass:5.972,g:9.81,day:1,temp:15,moons:1,a:1,summary:'Our ocean world has liquid surface water, a breathable atmosphere and one natural moon.',fact:'The only world currently known to host life; water covers about 71% of its surface.'},
{id:'mars',name:'Mars',type:'Rocky planet',color:'#e76c50',size:4.5,period:686.98,diam:6779,mass:.642,g:3.71,day:1.026,temp:-65,moons:2,a:1.524,summary:'A cold desert planet with a day only slightly longer than Earth’s.',fact:'Olympus Mons is the largest known volcano in the Solar System.'},
{id:'ceres',name:'Ceres',type:'Dwarf planet · Asteroid Belt',color:'#a69f98',size:1.5,period:1682,diam:939,mass:.00094,g:.28,day:.378,temp:-105,moons:0,a:2.77,summary:'The largest object in the main asteroid belt, a small icy-rocky dwarf planet between Mars and Jupiter.',fact:'Ceres holds about a third of the whole asteroid belt’s mass and has bright salt deposits.'},
{id:'jupiter',name:'Jupiter',type:'Gas giant',color:'#d6a17d',size:13,period:4332.59,diam:139820,mass:1898,g:24.79,day:.414,temp:-110,moons:95,a:5.203,summary:'A giant planet with immense gravity, fast rotation and a family of many moons.',fact:'Its Great Red Spot is a long-lived giant storm.'},
{id:'saturn',name:'Saturn',type:'Gas giant',color:'#e9c78b',size:11.2,period:10759.2,diam:116460,mass:568,g:10.44,day:.444,temp:-140,moons:146,a:9.537,summary:'A pale gold giant whose ring system spans hundreds of thousands of kilometres.',fact:'Less dense than water on average; its rings are wide but remarkably thin.'},
{id:'uranus',name:'Uranus',type:'Ice giant',color:'#83d9dc',size:8.2,period:30688.5,diam:50724,mass:86.8,g:8.69,day:-.718,temp:-195,moons:28,a:19.191,summary:'A distant cyan world with a dramatic tilt and a very long 84-Earth-year orbit.',fact:'Uranus essentially rolls around the Sun on its side.'},
{id:'neptune',name:'Neptune',type:'Ice giant',color:'#4778e8',size:8,period:60182,diam:49244,mass:102,g:11.15,day:.671,temp:-200,moons:16,a:30.07,summary:'A deep-blue ice giant whose year lasts about 165 Earth years.',fact:'Predicted mathematically before it was directly observed in 1846.'}];
const SUN={id:'sun',name:'Sun',type:'G-type main-sequence star',color:'#ffc94d',summary:'The star at the centre of our system. Its gravity holds everything together and fusion powers its light.',fact:'The Sun contains more than 99% of the Solar System’s mass.',stats:[['Diameter','1,392,700 km'],['Surface temp','≈5,500 °C'],['Mass','333,000 × Earth'],['Age','≈4.6 billion yr'],['Core temp','≈15 million °C'],['System mass','99.86%'],['Light to Earth','≈8 min 20 s'],['Class','G2V']]};
const fmt=n=>n.toLocaleString(undefined,{maximumFractionDigits:2});
// [name,parent,diameter km,distance km,period d,discovered,fact,size,orbit,color]
const MOONS=[
['Moon','earth',3474,384400,27.3,'Known since prehistory','Tidally locked: it always shows the same face to Earth. Apollo astronauts landed here in 1969–72.',.7,5,'#bdbdbd'],
['Phobos','mars',22.2,9376,.32,'Asaph Hall, 1877','Orbits so close that it circles Mars about 3 times a day, slowly spiralling inwards.',.22,3.2,'#8a7f78'],
['Deimos','mars',12.4,23463,1.26,'Asaph Hall, 1877','The smaller, outer moon of Mars, an irregular potato-shaped rock.',.18,4.4,'#a39a90'],
['Io','jupiter',3643,421700,1.77,'Galileo, 1610','The most volcanically active body in the Solar System.',.5,7.5,'#e8d36a'],
['Europa','jupiter',3122,671100,3.55,'Galileo, 1610','An icy shell hides a salty ocean, one of the top places to search for life.',.45,9,'#d9cdb8'],
['Ganymede','jupiter',5268,1070400,7.15,'Galileo, 1610','The largest moon in the Solar System, bigger than Mercury, with its own magnetic field.',.75,10.5,'#9c9387'],
['Callisto','jupiter',4821,1882700,16.69,'Galileo, 1610','One of the most heavily cratered surfaces known, a record of ancient impacts.',.65,12,'#6f665e'],
['Enceladus','saturn',504,238000,1.37,'William Herschel, 1789','Geysers of water ice from its south pole feed Saturn’s E ring.',.22,11.2,'#f2f6ff'],
['Rhea','saturn',1527,527100,4.52,'Cassini, 1672','Saturn’s second-largest moon, mostly water ice.',.4,12.5,'#c9c5bd'],
['Titan','saturn',5150,1221900,15.95,'Huygens, 1655','Has a thick nitrogen atmosphere and methane lakes. The Huygens probe landed here in 2005.',.7,14,'#d9a550'],
['Iapetus','saturn',1469,3560800,79.3,'Cassini, 1671','Two-toned: one hemisphere is dark and the other bright.',.4,15.5,'#a89a8a'],
['Miranda','uranus',472,129900,1.41,'Gerard Kuiper, 1948','A patchwork surface with giant canyons and cliffs up to about 20 km high.',.22,5.5,'#b5b8bd'],
['Ariel','uranus',1158,190900,2.52,'William Lassell, 1851','The brightest of Uranus’s major moons, crossed by canyons.',.32,6.8,'#c9ccd0'],
['Titania','uranus',1577,436300,8.71,'William Herschel, 1787','The largest moon of Uranus.',.45,8.2,'#b0aaa4'],
['Oberon','uranus',1523,583500,13.46,'William Herschel, 1787','The outermost of Uranus’s major moons, heavily cratered.',.43,9.5,'#8f8a85'],
['Triton','neptune',2707,354800,-5.88,'William Lassell, 1846','Orbits backwards, likely a captured Kuiper Belt object, with nitrogen geysers.',.5,7,'#cfc3c8']];
const minfo=id=>{const x=MOONS.find(m=>'moon:'+m[0]===id),pp=P.find(p=>p.id===x[1]);return{id,name:x[0],type:'Moon of '+pp.name,color:x[9],summary:x[0]+' is one of the major moons orbiting '+pp.name+'.',fact:x[6],stats:[['Diameter',fmt(x[2])+' km'],['Orbits',pp.name],['From planet',fmt(x[3])+' km'],['Orbit period',fmt(Math.abs(x[4]))+' d'+(x[4]<0?' retro':'')],['Discovered',x[5]]]}};
const info=id=>{if(id==='sun')return SUN;if(id.startsWith('moon:'))return minfo(id);const p=P.find(x=>x.id===id);
 return {...p,stats:[['Diameter',fmt(p.diam)+' km'],['From Sun',p.a+' AU'],['Year',p.period<700?fmt(p.period)+' d':(p.period/365.256).toFixed(1)+' yr'],
 ['Rotation',Math.abs(p.day)<2?Math.abs(p.day*24).toFixed(1)+' h':Math.abs(p.day)+' d'+(p.day<0?' retro':'')],['Gravity',p.g+' m/s²'],['Temp',p.temp+' °C'],['Moons',p.moons],['Mass',p.mass<.01?(p.mass*1e24).toExponential(1).replace('e+','×10^')+' kg':fmt(p.mass)+'e24 kg']]}};

// renderer / scene
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.xr.enabled=true;document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(60,1,.1,2000),rig=new THREE.Group();
rig.add(camera);scene.add(rig);
scene.add(new THREE.AmbientLight(0x8899bb,.45));scene.add(new THREE.PointLight(0xfff2d0,1.6,0));
{const n=2500,a=new Float32Array(n*3);for(let i=0;i<n;i++){const v=new V3().randomDirection?0:0;const u=Math.random()*2-1,t=Math.random()*6.283,s=Math.sqrt(1-u*u);a.set([1400*s*Math.cos(t),1400*u,1400*s*Math.sin(t)],i*3)}
const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(a,3));scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0xffffff,size:1.6,sizeAttenuation:false})))}
const hits=[],bodies=[];
const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(8,48,32),new THREE.MeshBasicMaterial({color:0xffc94d}));scene.add(sunMesh);
{const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,10,64,64,64);r.addColorStop(0,'rgba(255,200,80,.9)');r.addColorStop(1,'rgba(255,150,40,0)');g.fillStyle=r;g.fillRect(0,0,128,128);
const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(44,44,1);sunMesh.add(s)}
const sunHit=new THREE.Mesh(new THREE.SphereGeometry(10),new THREE.MeshBasicMaterial({visible:false}));sunHit.userData.id='sun';sunMesh.add(sunHit);hits.push(sunHit);
function tex(p){const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');g.fillStyle=p.color;g.fillRect(0,0,256,128);
 const gas=p.a>5;for(let i=0;i<(gas?40:70);i++){g.fillStyle=(Math.random()<.5?'rgba(255,255,255,':'rgba(0,0,0,')+(.05+Math.random()*.12)+')';
 if(gas)g.fillRect(0,Math.random()*128,256,3+Math.random()*10);else{g.beginPath();g.arc(Math.random()*256,Math.random()*128,2+Math.random()*10,0,7);g.fill()}}
 if(p.id==='earth'){g.fillStyle='rgba(60,170,80,.9)';for(let i=0;i<14;i++){g.beginPath();g.arc(Math.random()*256,20+Math.random()*90,8+Math.random()*14,0,7);g.fill()}}
 return new THREE.CanvasTexture(c)}
function label(t){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');g.font='bold 34px system-ui,sans-serif';g.textAlign='center';g.fillStyle='#fff';g.fillText(t,128,44);
 return new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true}))}
const ORB={mercury:24,venus:37,earth:52,mars:68,ceres:93,jupiter:124,saturn:162,uranus:196,neptune:226};
const belt=new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1,0),new THREE.MeshStandardMaterial({color:0x8d857c,roughness:1,flatShading:true}),1600),dm=new THREE.Object3D();
for(let i=0;i<1600;i++){const a=Math.random()*6.283,d=84+Math.random()*18+(Math.random()-.5)*4,s=.12+Math.random()*Math.random()*.55;dm.position.set(Math.cos(a)*d,(Math.random()-.5)*3,Math.sin(a)*d);dm.rotation.set(Math.random()*6,Math.random()*6,0);dm.scale.set(s,s*(.6+Math.random()*.6),s);dm.updateMatrix();belt.setMatrixAt(i,dm.matrix)}
scene.add(belt);{const bl=label('Asteroid Belt');bl.position.set(0,5,-93);bl.scale.set(28,7,1);scene.add(bl)}
P.forEach((p,i)=>{const R=ORB[p.id],r=p.size*.4,g=new THREE.Group(),m=new THREE.Mesh(new THREE.SphereGeometry(r,32,24),new THREE.MeshStandardMaterial({map:tex(p),roughness:.9}));
 g.add(m);const h=new THREE.Mesh(new THREE.SphereGeometry(Math.max(r*1.8,3.2)),new THREE.MeshBasicMaterial({visible:false}));h.userData.id=p.id;g.add(h);hits.push(h);
 if(p.id==='saturn'){const rg=new THREE.Mesh(new THREE.RingGeometry(r*1.4,r*2.3,64),new THREE.MeshBasicMaterial({color:0xcdb88a,side:THREE.DoubleSide,transparent:true,opacity:.75}));rg.rotation.x=-1.25;g.add(rg)}
 const lb=label(p.name);g.add(lb);scene.add(g);
 const mons=MOONS.filter(x=>x[1]===p.id).map(x=>{const id='moon:'+x[0],mm=new THREE.Mesh(new THREE.SphereGeometry(x[7],20,14),new THREE.MeshStandardMaterial({color:x[9],roughness:1})),mh=new THREE.Mesh(new THREE.SphereGeometry(Math.max(x[7]*2.2,1.1)),new THREE.MeshBasicMaterial({visible:false})),ml=label(x[0]);
  mh.userData.id=id;mm.add(mh);hits.push(mh);g.add(mm);g.add(ml);
  const op=[];for(let k=0;k<=64;k++)op.push(new V3(Math.cos(k/64*6.283)*x[8],0,Math.sin(k/64*6.283)*x[8]));
  g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(op),new THREE.LineBasicMaterial({color:0x556688,transparent:true,opacity:.35})));
  return{id,mm,ml,r:x[7],O:x[8],a0:Math.random()*6.283,w:(x[4]<0?-1:1)*1.2/Math.pow(Math.abs(x[4])+.3,.45)}});
 const pts=[];for(let k=0;k<=128;k++)pts.push(new V3(Math.cos(k/128*6.283)*R,0,Math.sin(k/128*6.283)*R));
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0x335588,transparent:true,opacity:.6})));
 bodies.push({id:p.id,g,m,lb,mons,R,r,a0:Math.random()*6.283,w:.35/Math.pow(p.period/88,.6),spin:.4+Math.random()*.5})});

// info panel (same canvas: DOM in flat mode, 3D plane in VR)
const pc=$('panel'),pg=pc.getContext('2d'),ptex=new THREE.CanvasTexture(pc);
const panel=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1.125),new THREE.MeshBasicMaterial({map:ptex,transparent:true,side:THREE.DoubleSide}));panel.visible=false;panel.renderOrder=10;scene.add(panel);
const BTN=[{n:'visit',x:40,y:562,w:440,h:56},{n:'overview',x:504,y:562,w:480,h:56}];
const rr=(x,y,w,h,r)=>{pg.beginPath();pg.moveTo(x+r,y);pg.arcTo(x+w,y,x+w,y+h,r);pg.arcTo(x+w,y+h,x,y+h,r);pg.arcTo(x,y+h,x,y,r);pg.arcTo(x,y,x+w,y,r);pg.closePath()};
const wrap=(t,x,y,w,lh)=>{let l='';for(const s of t.split(' ')){const n=l?l+' '+s:s;if(pg.measureText(n).width>w&&l){pg.fillText(l,x,y);y+=lh;l=s}else l=n}pg.fillText(l,x,y)};
function draw(id){const d=info(id),F='system-ui,"Segoe UI",sans-serif';pg.clearRect(0,0,1024,640);
 rr(4,4,1016,632,34);pg.fillStyle='rgba(9,21,42,.94)';pg.fill();pg.strokeStyle='#638cff';pg.lineWidth=4;pg.stroke();
 pg.fillStyle=d.color;pg.beginPath();pg.arc(76,74,30,0,7);pg.fill();
 pg.fillStyle='#fff';pg.font='bold 56px '+F;pg.fillText(d.name,126,92);pg.fillStyle='#9eafd0';pg.font='28px '+F;pg.fillText(d.type,126,128);
 pg.fillStyle='#d5e2ff';pg.font='30px '+F;wrap(d.summary,40,188,944,38);
 d.stats.forEach((s,i)=>{const x=40+(i%4)*242,y=290+Math.floor(i/4)*86;rr(x,y,226,74,12);pg.fillStyle='#0f1d3a';pg.fill();pg.fillStyle='#8fa9d8';pg.font='bold 19px '+F;pg.fillText(s[0].toUpperCase(),x+14,y+26);pg.fillStyle='#fff';pg.font='bold 25px '+F;pg.fillText(String(s[1]),x+14,y+58)});
 pg.fillStyle='#ffd16a';pg.font='italic 25px '+F;wrap(d.fact,40,490,944,32);
 BTN.forEach(b=>{rr(b.x,b.y,b.w,b.h,14);pg.fillStyle=b.n==='visit'?'#638cff':'#1b2c50';pg.fill();pg.fillStyle='#fff';pg.font='bold 28px '+F;pg.textAlign='center';pg.fillText(b.n==='visit'?'Visit '+d.name:'Back to overview',b.x+b.w/2,b.y+38);pg.textAlign='left'});
 ptex.needsUpdate=true}
const btnAt=(x,y)=>{const b=BTN.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);return b&&b.n};

// state
let vr=false,selected=null,visiting=null,hover=null,ctrls=0,gk=null,gt=0,fired=false;
const target=new V3(),visitOff=new V3(),cp=new V3(),cd=new V3();
let yaw=0,pitch=.35,distT=330,distC=330;
const allMoons=()=>bodies.flatMap(b=>b.mons);
const posOf=id=>{if(id==='sun')return new V3();if(id.startsWith('moon:'))return allMoons().find(m=>m.id===id).mm.getWorldPosition(new V3());return bodies.find(b=>b.id===id).g.position};
const radOf=id=>id==='sun'?8:id.startsWith('moon:')?allMoons().find(m=>m.id===id).r:bodies.find(b=>b.id===id).r;
function placePanel(){if(!vr||!selected)return;scene.updateMatrixWorld(true);camera.getWorldPosition(cp);camera.getWorldDirection(cd);cd.y=0;cd.normalize();
 panel.position.copy(cp).addScaledVector(cd,2.2);panel.position.y=cp.y-.1;panel.lookAt(cp);panel.visible=true}
function select(id){selected=id;draw(id);if(vr)placePanel();else pc.style.display='block'}
function visit(id){visiting=id;const r=radOf(id);
 if(vr){const c=posOf(id),back=id==='sun'?new V3(0,0,1):new V3(-c.x,0,-c.z).normalize();visitOff.copy(back).multiplyScalar(r*5+3);visitOff.y=r*1.2;
  rig.rotation.y=Math.atan2(back.x,back.z);rig.position.copy(c).add(visitOff);placePanel()}else distT=r*7+6}
function overview(){visiting=null;if(vr){rig.position.set(0,70,270);rig.rotation.set(0,0,0);placePanel()}else distT=330}
function act(h){if(!h)return;if(h.btn==='visit')visit(selected);else if(h.btn==='overview')overview();else if(h.id)select(h.id)}

// picking
const ray=new THREE.Raycaster();ray.far=1500;
function pick(){const hp=panel.visible?ray.intersectObject(panel)[0]:null;if(hp)return{btn:btnAt(hp.uv.x*1024,(1-hp.uv.y)*640)||'panel'};
 const h=ray.intersectObjects(hits)[0];return h?{id:h.object.userData.id}:null}
const pickVec=(o,d)=>{ray.set(o,d.clone().normalize());return pick()};
const pickNDC=e=>{ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},camera);return pick()};

// flat controls (drag / pinch / wheel / tap)
const el=renderer.domElement,ptrs=new Map();let moved=0,pinch=0;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,e);moved=0;pinch=0});
el.addEventListener('pointermove',e=>{if(vr)return;const p=ptrs.get(e.pointerId);
 if(!p){const h=pickNDC(e);hover=h&&h.id||null;el.style.cursor=hover?'pointer':'default';return}
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(pinch)distT=Math.min(600,Math.max(radOf(visiting||'sun')+6,distT*pinch/d));pinch=d;moved=99}
 else{yaw-=(e.clientX-p.clientX)*.006;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-p.clientY)*.006));moved+=Math.abs(e.movementX||0)+Math.abs(e.movementY||0)}
 ptrs.set(e.pointerId,e)});
el.addEventListener('pointerup',e=>{ptrs.delete(e.pointerId);if(!vr&&moved<6&&!ptrs.size)act(pickNDC(e))});
el.addEventListener('wheel',e=>{distT=Math.min(600,Math.max(radOf(visiting||'sun')+6,distT*(1+Math.sign(e.deltaY)*.1)))},{passive:true});
pc.addEventListener('click',e=>{const b=btnAt(e.offsetX/pc.clientWidth*1024,e.offsetY/pc.clientHeight*640);if(b)act({btn:b})});

// VR
const vrBtn=$('vr');
if(navigator.xr)navigator.xr.isSessionSupported('immersive-vr').then(ok=>{vrBtn.textContent=ok?'Enter VR':'VR not supported on this device';vrBtn.disabled=!ok;
 if(ok)vrBtn.onclick=()=>{navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']}).then(s=>{renderer.xr.setReferenceSpaceType('local-floor');renderer.xr.setSession(s)})}}).catch(()=>{vrBtn.textContent='VR unavailable'});
else vrBtn.textContent='WebXR not available';
const reticle=new THREE.Mesh(new THREE.RingGeometry(.012,.02,32),new THREE.MeshBasicMaterial({color:0xffffff,depthTest:false,transparent:true,opacity:.9}));
reticle.position.z=-1.2;reticle.renderOrder=20;reticle.visible=false;camera.add(reticle);
for(let i=0;i<2;i++){const c=renderer.xr.getController(i);
 c.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([new V3(),new V3(0,0,-150)]),new THREE.LineBasicMaterial({color:0x7fb0ff,transparent:true,opacity:.5})));
 c.addEventListener('connected',()=>ctrls++);c.addEventListener('disconnected',()=>ctrls=Math.max(0,ctrls-1));
 c.addEventListener('selectstart',()=>{c.updateMatrixWorld(true);act(pickVec(new V3().setFromMatrixPosition(c.matrixWorld),new V3(0,0,-1).transformDirection(c.matrixWorld)))});rig.add(c)}
renderer.xr.addEventListener('sessionstart',()=>{vr=true;pc.style.display='none';reticle.visible=true;vrBtn.textContent='Exit VR';overview();if(selected)placePanel()});
renderer.xr.addEventListener('sessionend',()=>{vr=false;rig.position.set(0,0,0);rig.rotation.set(0,0,0);reticle.visible=false;panel.visible=false;vrBtn.textContent='Enter VR';visiting=null;distT=330;if(selected)pc.style.display='block'});

function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

let last=performance.now(),sim=0;
renderer.setAnimationLoop(()=>{const now=performance.now(),dt=Math.min(.05,(now-last)/1000);last=now;sim+=dt;
 sunMesh.rotation.y+=dt*.05;belt.rotation.y=sim*.04;sunMesh.scale.setScalar(THREE.MathUtils.lerp(sunMesh.scale.x,hover==='sun'?1.08:1,.2));
 bodies.forEach(b=>{const a=b.a0+sim*b.w;b.g.position.set(Math.cos(a)*b.R,0,Math.sin(a)*b.R);b.m.rotation.y+=dt*b.spin;
  b.m.scale.setScalar(THREE.MathUtils.lerp(b.m.scale.x,hover===b.id?1.2:1,.2));
  b.mons.forEach(o=>{const a2=o.a0+sim*o.w;o.mm.position.set(Math.cos(a2)*o.O,0,Math.sin(a2)*o.O);o.mm.scale.setScalar(THREE.MathUtils.lerp(o.mm.scale.x,hover===o.id?1.5:1,.2))})});
 if(vr){if(visiting)rig.position.copy(posOf(visiting)).add(visitOff);
  camera.updateMatrixWorld(true);camera.getWorldPosition(cp);camera.getWorldDirection(cd);const h=pickVec(cp,cd),k=h&&(h.btn||h.id);hover=h&&h.id||null;
  if(ctrls===0){if(k&&k===gk){gt+=dt;if(gt>1.5&&!fired){fired=true;act(h)}}else{gk=k;gt=0;fired=false}}else{gt=0;gk=null}
  reticle.scale.setScalar(1+(fired?0:gt/1.5)*2.5)}
 else{target.lerp(visiting?posOf(visiting):new V3(),.08);distC+=(distT-distC)*.08;
  camera.position.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)).multiplyScalar(distC).add(target);camera.lookAt(target)}
 camera.getWorldPosition(cp);
 bodies.forEach(b=>{const s=Math.max(3,cp.distanceTo(b.g.position)*.045);b.lb.scale.set(s*4,s,1);b.lb.position.y=b.r+s*.9;
  const near=cp.distanceTo(b.g.position)<70,ms=Math.max(.8,s*.6);b.mons.forEach(o=>{o.ml.visible=near;o.ml.scale.set(ms*4,ms,1);o.ml.position.copy(o.mm.position);o.ml.position.y+=o.r+ms*.9})});
 renderer.render(scene,camera)});
})();
